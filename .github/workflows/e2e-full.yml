# DO NOT MERGE: temporary branch-only diagnostic, one manually authorized run.
name: Worker Runtime Diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Default-parallel Node then whole native Worker suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install pinned workspace dependencies in isolated home
        run: node scripts/diagnose-worker-runtime.mjs --isolated pnpm install --frozen-lockfile
      - name: Build declared prerequisites and measure both unchanged suites once
        run: node scripts/diagnose-worker-runtime.mjs
      - name: Retain logs, safe stages, counts and runtime metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-runtime-diagnostic
          path: |
            .tmp/worker-runtime-diagnostic/*.log
            .tmp/worker-runtime-diagnostic/*.json
          if-no-files-found: error
          retention-days: 7
