name: Full E2E

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('e2e-full-pr-{0}', github.event.pull_request.number) || format('e2e-full-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: Full E2E Smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E Smoke scenario
        env:
          CODEMEM_E2E_BUILD: "1"
          CODEMEM_E2E_ARTIFACTS_DIR: .tmp/e2e-artifacts
          CODEMEM_E2E_JSON: "1"
        run: pnpm run e2e:smoke -- --json

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-smoke-artifacts
          path: .tmp/e2e-artifacts
          if-no-files-found: ignore

  e2e-specialized:
    name: Full E2E ${{ matrix.name }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Legacy Team Migration
            script: e2e:legacy-team-migration
            artifact: legacy-team-migration
          - name: Project Sharing
            script: e2e:project-sharing
            artifact: project-sharing
          - name: Sharing Domains
            script: e2e:sharing-domains
            artifact: sharing-domains

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Full E2E ${{ matrix.name }} scenario
        env:
          CODEMEM_E2E_BUILD: "1"
          CODEMEM_E2E_ARTIFACTS_DIR: .tmp/e2e-artifacts
          CODEMEM_E2E_JSON: "1"
        run: pnpm run ${{ matrix.script }} -- --json

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-${{ matrix.artifact }}-artifacts
          path: .tmp/e2e-artifacts
          if-no-files-found: ignore
