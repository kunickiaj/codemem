name: CI

on:
  push:
    branches: [main]
  pull_request:

  workflow_call:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tsc:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript project reference check
        run: pnpm run tsc

  ts-test:
    name: TypeScript Test
    runs-on: ubuntu-latest
    env:
      CI_FORCE_FULL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '1' || '0' }}

    steps:
      - uses: actions/checkout@v6
        with:
          # The automatic-recall baseline test archives a pinned historical main commit.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy viewer static assets
        run: |
          mkdir -p packages/viewer-server/static
          cp packages/ui/static/index.html packages/ui/static/favicon.svg packages/viewer-server/static/

      - name: Build
        run: pnpm run build

      - name: Compute task-cache identity
        id: identity
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { runtimeFingerprint } from './scripts/ci-package-inputs.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT, `runtime=${runtimeFingerprint(process.cwd())}\nepoch=${Math.floor(Date.now() / 86400000)}\ncache=${join(process.env.RUNNER_TEMP, 'ci-package-cache')}\n`);
          NODE
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: task-cache
        if: env.CI_FORCE_FULL == '0'
        continue-on-error: true
        with:
          path: ${{ steps.identity.outputs.cache }}/pipeline/*/tasks
          key: package-probe-v1-${{ github.event.pull_request.number }}-ci-packages-${{ steps.identity.outputs.runtime }}-${{ steps.identity.outputs.epoch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            package-probe-v1-${{ github.event.pull_request.number }}-ci-packages-${{ steps.identity.outputs.runtime }}-${{ steps.identity.outputs.epoch }}-
      - name: Test
        env:
          CI_FORCE_FULL: ${{ steps.task-cache.outcome == 'failure' && '1' || env.CI_FORCE_FULL }}
          CI_PACKAGE_CACHE_DIR: ${{ steps.identity.outputs.cache }}
        run: pnpm run ci:package-probe ci-packages
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tests
          path: |
            .tmp/ci-package-test/**
            packages/*/.tmp/ci-package-test/**
            ${{ steps.identity.outputs.cache }}/pipeline/*/runs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  account-browser:
    name: Account Browser Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @codemem/ui exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      - name: Run synthetic account browser acceptance
        run: pnpm --filter @codemem/ui test:account-browser

  worker-test:
    name: Cloudflare Worker Test
    runs-on: ubuntu-latest
    env:
      CI_FORCE_FULL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || contains(github.event.pull_request.labels.*.name, 'ci:full')) && '1' || '0' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute task-cache identity
        id: identity
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { runtimeFingerprint } from './scripts/ci-package-inputs.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT, `runtime=${runtimeFingerprint(process.cwd())}\nepoch=${Math.floor(Date.now() / 86400000)}\ncache=${join(process.env.RUNNER_TEMP, 'ci-package-cache')}\n`);
          NODE
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: task-cache
        if: env.CI_FORCE_FULL == '0'
        continue-on-error: true
        with:
          path: ${{ steps.identity.outputs.cache }}/pipeline/*/tasks
          key: package-probe-v1-${{ github.event.pull_request.number }}-ci-worker-${{ steps.identity.outputs.runtime }}-${{ steps.identity.outputs.epoch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            package-probe-v1-${{ github.event.pull_request.number }}-ci-worker-${{ steps.identity.outputs.runtime }}-${{ steps.identity.outputs.epoch }}-
      - name: Worker integration test
        env:
          CI_FORCE_FULL: ${{ steps.task-cache.outcome == 'failure' && '1' || env.CI_FORCE_FULL }}
          CI_PACKAGE_CACHE_DIR: ${{ steps.identity.outputs.cache }}
        run: pnpm run ci:package-probe ci-worker
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-tests
          path: |
            packages/cloudflare-coordinator-worker/.tmp/ci-package-test/**
            ${{ steps.identity.outputs.cache }}/pipeline/*/runs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ts-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # The delta ratchet compares the immutable target and source commits, including stacked PR bases.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome delta ratchet
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          mkdir -p .tmp/biome-delta
          pnpm --silent lint:delta -- --base "$BASE_SHA" --head "$MERGE_SHA" --json --github-annotations > .tmp/biome-delta/report.json

      - name: Biome check
        run: pnpm run lint

      - name: Upload Biome delta report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: biome-delta-${{ github.event.pull_request.base.sha }}-${{ github.sha }}
          path: .tmp/biome-delta/report.json
          if-no-files-found: error
          retention-days: 7

  plugin-smoke:
    name: Plugin Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install minimum supported OpenCode 1 plugin runtime
        run: |
          npm install --prefix packages/cli/.opencode --no-save @opencode-ai/plugin@1.18.29
          npm install --prefix packages/opencode-plugin/.opencode --no-save @opencode-ai/plugin@1.18.29

      - name: Run plugin unit tests
        run: pnpm --filter codemem test:plugin && pnpm --filter @codemem/opencode-plugin test && pnpm --filter codemem test:smoke

  packaged-plugin-smoke:
    name: Packaged Plugin Smoke Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy viewer static assets
        run: |
          mkdir -p packages/viewer-server/static
          cp packages/ui/static/index.html packages/ui/static/favicon.svg packages/viewer-server/static/

      - name: Build
        run: pnpm run build

      - name: Run packed artifact smoke test
        run: |
          pnpm --filter @codemem/opencode-plugin test:packed-artifact:prepared
          pnpm --filter @codemem/opencode-plugin test:opencode-v2-contract
          pnpm --filter codemem test:packed-artifact

  windows-embedding-runtime-smoke:
    name: Windows Embedding Runtime Smoke Test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build embedding runtime
        run: pnpm --filter @codemem/embeddings build

      - name: Run packed Windows x64 inference probe
        run: pnpm --filter @codemem/embeddings test:packed-runtime
        env:
          CODEMEM_EXPECT_WINDOWS_X64: "1"

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E Smoke scenario
        env:
          CODEMEM_E2E_BUILD: "1"
          CODEMEM_E2E_ARTIFACTS_DIR: .tmp/e2e-artifacts
          CODEMEM_E2E_JSON: "1"
        run: pnpm run e2e:smoke -- --json

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-artifacts
          path: .tmp/e2e-artifacts
          if-no-files-found: ignore

  e2e-specialized:
    name: E2E ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Legacy Team Migration
            script: e2e:legacy-team-migration
            artifact: legacy-team-migration
          - name: Project Sharing
            script: e2e:project-sharing
            artifact: project-sharing
          - name: Sharing Domains
            script: e2e:sharing-domains
            artifact: sharing-domains

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E ${{ matrix.name }} scenario
        env:
          CODEMEM_E2E_BUILD: "1"
          CODEMEM_E2E_ARTIFACTS_DIR: .tmp/e2e-artifacts
          CODEMEM_E2E_JSON: "1"
        run: pnpm run ${{ matrix.script }} -- --json

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.artifact }}-artifacts
          path: .tmp/e2e-artifacts
          if-no-files-found: ignore
