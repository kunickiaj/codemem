name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

  workflow_call:

permissions:
  contents: read

jobs:
  tsc:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript project reference check
        run: pnpm run tsc

  ts-test:
    name: TypeScript Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy viewer static assets
        run: |
          mkdir -p packages/viewer-server/static
          cp packages/ui/static/index.html packages/ui/static/favicon.svg packages/viewer-server/static/

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:release && pnpm run test:adapter-normalizers && pnpm run test

  worker-test:
    name: Cloudflare Worker Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Worker integration test
        run: pnpm --filter @codemem/cloudflare-coordinator-worker test:worker

  ts-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm run lint

  plugin-smoke:
    name: Plugin Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install plugin runtime dependency
        run: |
          npm install --prefix packages/cli/.opencode --no-save @opencode-ai/plugin@1.2.27
          npm install --prefix packages/opencode-plugin/.opencode --no-save @opencode-ai/plugin@1.2.27

      - name: Run plugin unit tests
        run: pnpm --filter codemem test:plugin && pnpm --filter codemem test:smoke

  packaged-plugin-smoke:
    name: Packaged Plugin Smoke Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy viewer static assets
        run: |
          mkdir -p packages/viewer-server/static
          cp packages/ui/static/index.html packages/ui/static/favicon.svg packages/viewer-server/static/

      - name: Build
        run: pnpm run build

      - name: Run packed artifact smoke test
        run: |
          pnpm --filter @codemem/opencode-plugin test:packed-artifact
          pnpm --filter codemem test:packed-artifact

  windows-embedding-runtime-smoke:
    name: Windows Embedding Runtime Smoke Test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build embedding runtime
        run: pnpm --filter @codemem/embeddings build

      - name: Run packed Windows x64 inference probe
        run: pnpm --filter @codemem/embeddings test:packed-runtime
        env:
          CODEMEM_EXPECT_WINDOWS_X64: "1"

  e2e:
    name: E2E ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Smoke
            script: e2e:smoke
            artifact: smoke
          - name: Legacy Team Migration
            script: e2e:legacy-team-migration
            artifact: legacy-team-migration
          - name: Project Sharing
            script: e2e:project-sharing
            artifact: project-sharing
          - name: Sharing Domains
            script: e2e:sharing-domains
            artifact: sharing-domains

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E ${{ matrix.name }} scenario
        env:
          CODEMEM_E2E_BUILD: "1"
          CODEMEM_E2E_ARTIFACTS_DIR: .tmp/e2e-artifacts
          CODEMEM_E2E_JSON: "1"
        run: pnpm run ${{ matrix.script }} -- --json

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.artifact }}-artifacts
          path: .tmp/e2e-artifacts
          if-no-files-found: ignore

  ci-gate:
    name: CI Gate
    if: always()
    needs: [tsc, ts-test, worker-test, ts-lint, plugin-smoke, packaged-plugin-smoke, windows-embedding-runtime-smoke, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Require successful CI jobs
        run: node .github/scripts/ci-gate.mjs
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_NEEDS: ${{ toJSON(needs) }}
