name: UI Visual Regression

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ui-visual-pr-{0}', github.event.pull_request.number) || format('ui-visual-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  optimize-ci:
    name: Graphite CI Optimizer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # Skips CI for PRs high in a Graphite stack; they run once they are near the
      # bottom. Fails open: a missing token, API error, or fork PR runs everything.
      - name: Ask Graphite whether this PR should run CI
        id: check
        continue-on-error: true
        uses: withgraphite/graphite-ci-action@402a89bc8aa6db18ae1f9c61953d001d5f9d828f # main 2026-06-25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}

  ui-visual:
    name: UI Visual Regression
    needs: optimize-ci
    # Runs on push and when the optimizer is skipped, fails, or says to run.
    if: ${{ !cancelled() && needs.optimize-ci.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check visual harness policy and types
        run: pnpm --filter @codemem/ui visual:test-harness && pnpm --filter @codemem/ui visual:typecheck

      - name: Verify strict comparator behavior
        env:
          CI: "true"
          CODEMEM_VISUAL_OUTPUT: ../../.tmp/visual-ci/control
        run: pnpm --filter @codemem/ui exec playwright test --config playwright.control.config.ts

      - name: Compare gallery screenshots
        env:
          CI: "true"
          CODEMEM_VISUAL_OUTPUT: ../../.tmp/visual-ci/results
        run: pnpm --filter @codemem/ui exec playwright test --config playwright.config.ts

      - name: Upload visual differences on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-visual-results
          path: .tmp/visual-ci/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
