packages:
  - packages/*

# These nodes propagate source keys, without running dependency test suites.
tasks:
  'ci:inputs':
    dependsOn: ['^ci:inputs']
    outputs: []
    env: [CI_SHARED_INPUTS, CI_RUNTIME, CI_RESULT_EPOCH]
  'ci:test': &package_test
    dependsOn: ['^ci:inputs']
    outputs: ['.tmp/ci-package-test/unit/**']
    env: [CI_SHARED_INPUTS, CI_RUNTIME, CI_RESULT_EPOCH]
    concurrencyGroup: ci-vitest
  'ci:test:ui':
    <<: *package_test
    env: [CI_SHARED_INPUTS, CI_RUNTIME, CI_RESULT_EPOCH, CI_UI_COMMIT]
  'ci:worker':
    <<: *package_test
    outputs: ['.tmp/ci-package-test/worker-integration/**']
  'ci:test:core': &broad_test
    dependsOn: []
    outputs: ['.tmp/ci-package-test/core/**']
    env: [CI_SHARED_INPUTS, CI_RUNTIME, CI_RESULT_EPOCH]
    concurrencyGroup: ci-vitest
  'ci:test:viewer':
    <<: *broad_test
    outputs: ['.tmp/ci-package-test/viewer-server/**']
  'ci:test:cli':
    <<: *broad_test
    outputs: ['.tmp/ci-package-test/cli/**']
  'ci:test:root':
    <<: *broad_test
    outputs: ['.tmp/ci-package-test/e2e-unit/**']
  'ci:test:performance':
    dependsOn: []
    cache: false
    concurrencyGroup: ci-vitest

concurrencyGroups:
  ci-vitest: 1

pipelines:
  ci-packages: ['ci:test', 'ci:test:ui', 'ci:test:core', 'ci:test:viewer', 'ci:test:cli', 'ci:test:root', 'ci:test:performance']
  ci-worker: ['ci:worker']

allowBuilds:
  '@google/genai': false # transitive dev-only dep of pi-coding-agent; never run its build script
  '@opencode/cli': true
  better-sqlite3: false
  esbuild: true
  msgpackr-extract: true
  # The embedding runtime is CPU-pinned; skip ONNX Runtime's Linux CUDA download.
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  workerd: true

overrides:
  better-sqlite3: 13.0.3
  fast-uri: 3.1.7
  '@modelcontextprotocol/sdk>@hono/node-server': 1.19.17
  '@modelcontextprotocol/sdk>hono': 4.13.5
  'express-rate-limit>ip-address': 10.7.0
  'express>body-parser': 2.3.0
  'router>path-to-regexp': 8.4.2
  'miniflare>sharp': 0.35.4
  'miniflare>ws': 8.21.0
  '@rollup/pluginutils@5>picomatch': 4.0.4
  '@esbuild-kit/core-utils>esbuild': 0.28.1
  'drizzle-kit>esbuild': 0.28.1
  '@opentelemetry/core': 2.8.0
  'onnxruntime-node>adm-zip': 0.6.0
  '@huggingface/transformers>sharp': 0.35.4
  undici: '>=7.29.1 <8'

catalog:
  "@biomejs/biome": ^2.5.11
  "@hono/node-server": ^2.1.1
  "@types/better-sqlite3": ^9.6.0
  drizzle-orm: ^0.45.2
  hono: ^4.13.5
  limiter: ^3.0.0
  tsx: ^4.23.13
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11
  zod: 4.6.6

# Temporary, approved exception for the OpenCode 2.0.24 contract evaluation.
# Remove once these exact versions clear the configured minimum release age.
minimumReleaseAgeExclude:
  - '@opencode/ai@2.0.24'
  - '@opencode/cli-darwin-arm64@2.0.24'
  - '@opencode/cli-darwin-x64-baseline@2.0.24'
  - '@opencode/cli-darwin-x64@2.0.24'
  - '@opencode/cli-linux-arm64-musl@2.0.24'
  - '@opencode/cli-linux-arm64@2.0.24'
  - '@opencode/cli-linux-x64-baseline-musl@2.0.24'
  - '@opencode/cli-linux-x64-baseline@2.0.24'
  - '@opencode/cli-linux-x64-musl@2.0.24'
  - '@opencode/cli-linux-x64@2.0.24'
  - '@opencode/cli-windows-arm64@2.0.24'
  - '@opencode/cli-windows-x64-baseline@2.0.24'
  - '@opencode/cli-windows-x64@2.0.24'
  - '@opencode/cli@2.0.24'
  - '@opencode/client@2.0.24'
  - '@opencode/plugin@2.0.24'
  - '@opencode/protocol@2.0.24'
  - '@opencode/schema@2.0.24'
  - '@opencode/util@2.0.24'
