packages:
  - packages/*

allowBuilds:
  '@opencode/cli': true
  better-sqlite3: false
  esbuild: true
  msgpackr-extract: true
  # The embedding runtime is CPU-pinned; skip ONNX Runtime's Linux CUDA download.
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  workerd: true

overrides:
  better-sqlite3: 13.0.3
  fast-uri: 3.1.5
  '@modelcontextprotocol/sdk>@hono/node-server': 1.19.17
  '@modelcontextprotocol/sdk>hono': 4.13.5
  'express-rate-limit>ip-address': 10.7.0
  'express>body-parser': 2.3.0
  'router>path-to-regexp': 8.4.2
  'miniflare>ws': 8.20.1
  '@rollup/pluginutils@5>picomatch': 4.0.4
  'onnxruntime-node>adm-zip': 0.6.0
  '@huggingface/transformers>sharp': 0.35.4
  undici: '>=7.28.0 <8'

catalog:
  "@biomejs/biome": ^2.5.11
  "@hono/node-server": ^2.1.1
  "@types/better-sqlite3": ^9.6.0
  drizzle-orm: ^0.45.2
  hono: ^4.13.5
  limiter: ^3.0.0
  tsx: ^4.23.13
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11

# Temporary, approved exception for the OpenCode 2.0.2 contract evaluation.
# Remove once these exact versions clear the configured minimum release age.
minimumReleaseAgeExclude:
  - '@opencode/ai@2.0.2'
  - '@opencode/cli-darwin-arm64@2.0.2'
  - '@opencode/cli-darwin-x64-baseline@2.0.2'
  - '@opencode/cli-darwin-x64@2.0.2'
  - '@opencode/cli-linux-arm64-musl@2.0.2'
  - '@opencode/cli-linux-arm64@2.0.2'
  - '@opencode/cli-linux-x64-baseline-musl@2.0.2'
  - '@opencode/cli-linux-x64-baseline@2.0.2'
  - '@opencode/cli-linux-x64-musl@2.0.2'
  - '@opencode/cli-linux-x64@2.0.2'
  - '@opencode/cli-windows-arm64@2.0.2'
  - '@opencode/cli-windows-x64-baseline@2.0.2'
  - '@opencode/cli-windows-x64@2.0.2'
  - '@opencode/cli@2.0.2'
  - '@opencode/client@2.0.2'
  - '@opencode/plugin@2.0.2'
  - '@opencode/protocol@2.0.2'
  - '@opencode/schema@2.0.2'
  - '@opencode/util@2.0.2'
